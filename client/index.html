<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GameOfAILife</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="view/view.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="godview">
  <header>
    <h1>GameOfAILife</h1>
    <div id="clock">Connecting…</div>
    <div id="weather"></div>
    <div id="speed" role="group" aria-label="Speed">
      <button type="button" data-speed="0" title="Pause" aria-label="Pause">⏸</button>
      <button type="button" data-speed="1">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <button type="button" data-speed="8">8x</button>
      <button type="button" data-speed="16">16x</button>
    </div>
    <div id="role"></div>
  </header>
  <main id="stage">
    <section id="world">
      <canvas id="map"></canvas>
      <div id="hud"></div>
      <div id="overlay-chips"></div>
      <div id="toasts"></div>
      <div id="ticker"></div>
      <div id="tooltip" hidden></div>
    </section>
    <aside id="panel"></aside>
  </main>
  <script src="view/proj.js"></script>
  <script src="view/art.js"></script>
  <script src="view/buildings.js"></script>
  <script src="view/actors.js"></script>
  <script src="view/scene.js"></script>
  <script src="view/movers.js"></script>
  <script src="view/camera.js"></script>
  <script src="view/minimap.js"></script>
  <script src="view/view.js"></script>
  <script src="dashboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
